<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSR bookings · LPTI</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .booking-card{padding:16px 18px;margin-bottom:14px}
    .booking-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .booking-time{font-size:22px;font-weight:800;color:var(--blue)}
    .booking-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:12px 0}
    .booking-grid div{font-size:13px}.booking-grid b{display:block;font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase}
    .badge{border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#eef3f7}
    .badge.accepted{background:#e3f6ea;color:#1d6b3a}.badge.unassigned{background:#fff0f0;color:#8f2020}
    .booking-actions{display:flex;gap:8px}
    .picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
    .picker label{display:grid;gap:4px;font-size:12px;font-weight:650;color:#33495c}
    .picker input,.picker select{padding:8px;border:1px solid #b8c5cf;border-radius:6px;font:inherit;background:white}
  </style>
</head>
<body>
  <header class="topbar">
    <div><h1>CSR bookings</h1><p>Select your name, enter your PIN, then accept or reject each booking</p></div>
  </header>
  <main class="container">
    <section class="card csr-card">
      <div class="picker">
        <label>Your name<select id="pickName"></select></label>
        <label>Service date<input id="pickDate" type="date"></label>
        <label>PIN<input id="pickPin" inputmode="numeric" maxlength="6" autocomplete="off"></label>
        <button id="showBtn" class="btn primary" type="button">Show my bookings</button>
      </div>
      <div id="pageMessage" class="message hidden" role="status"></div>
    </section>
    <section id="availSection" class="card csr-card hidden">
      <h2>My availability</h2>
      <p>Mark Available or On leave for today and the next 2 days. Once you accept a booking on a date, that date is locked.</p>
      <div id="availRows" class="avail-grid"></div>
      <div id="availMessage" class="message hidden" role="status"></div>
    </section>
    <div id="bookings"></div>
  </main>
  <footer>Bookings are loaded from the LPTI roster. Only your own bookings are shown.</footer>
  <script type="module" src="js/publish.js"></script>
</body>
</html>
